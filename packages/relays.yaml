---
# Two general-purpose relay outputs, each with a watchdog.
#
#   packages:
#     relays: !include ../packages/relays.yaml
#
# Expects `relay0_pin` and `relay1_pin` substitutions (the board packages
# provide them).
#
# The watchdog is the safety feature worth keeping from the AVR firmware: a
# relay left on is usually a solenoid valve held open, and if the thing that
# turned it on stops talking -- a crashed script, a dropped network, a closed
# browser tab -- nobody is left to turn it off. Each relay therefore switches
# itself off after `relay_watchdog_timeout` from the moment it turns on.
#
# The timer runs from the on-edge and cannot be refreshed while the relay is
# already on (repeated turn_on commands are deduplicated and do not re-fire
# on_turn_on); an off/on cycle restarts it.
#
# IMPORTANT: if a relay is grant-driven (listed under the reporter's
# `relays:`), set `relay_watchdog_timeout` LONGER than kegboard_auth's
# `max_grant_duration` (default 5min) — or `0s` to disable — or the watchdog
# will close the valve mid-grant. Grant-held relays already have a
# device-side bound: the grant clamp. The watchdog earns its keep on relays
# driven manually or from Home Assistant.

substitutions:
  relay_watchdog_timeout: 10s

switch:
  - platform: gpio
    id: relay0
    name: Relay 1
    pin: ${relay0_pin}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: relay0_watchdog
    on_turn_off:
      - script.stop: relay0_watchdog

  - platform: gpio
    id: relay1
    name: Relay 2
    pin: ${relay1_pin}
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: relay1_watchdog
    on_turn_off:
      - script.stop: relay1_watchdog

script:
  - id: relay0_watchdog
    mode: restart
    then:
      - delay: ${relay_watchdog_timeout}
      - logger.log:
          format: "Relay 1 watchdog expired, turning off"
          level: WARN
      - switch.turn_off: relay0

  - id: relay1_watchdog
    mode: restart
    then:
      - delay: ${relay_watchdog_timeout}
      - logger.log:
          format: "Relay 2 watchdog expired, turning off"
          level: WARN
      - switch.turn_off: relay1
